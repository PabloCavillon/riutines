<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#FAFAFA;color:#18181B;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}
header{padding:24px 20px 8px}.s{color:#71717A;font-size:14px}h1{font-size:24px;font-weight:700;margin-top:2px}
.ring{display:flex;align-items:center;gap:14px;margin:14px 20px;padding:16px;background:#fff;border:1px solid #E4E4E7;border-radius:14px}

.card{display:flex;align-items:center;gap:12px;margin:8px 20px;padding:14px;background:#fff;border:1px solid #E4E4E7;border-radius:12px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #D4D4D8}.ck.on{background:#2563EB;border-color:#2563EB}.f{flex:1}.m{font-size:12px;color:#71717A}
h2{font-size:14px;font-weight:600;padding:14px 20px 0}.tab{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:14px;border-top:1px solid #E4E4E7;background:#fff;font-size:12px;color:#71717A}
</style></head><body>
